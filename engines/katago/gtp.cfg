# teleGO local play: bounded GPU work, no background pondering.
rules = japanese
komi = 6.5
maxVisits = 64
maxTime = 2.0
numSearchThreads = 4
nnMaxBatchSize = 4
nnCacheSizePowerOfTwo = 18
nnMutexPoolSizePowerOfTwo = 14
ponderingEnabled = false
allowResignation = true
resignThreshold = -0.95
resignConsecTurns = 3
resignMinMovesPerBoardArea = 0.25
logAllGTPCommunication = false
logSearchInfo = false
logToStderr = true
homeDataDir = runtime
